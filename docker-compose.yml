services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticket_system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket_system}
      POSTGRES_DB: ${POSTGRES_DB:-ticket_system}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ticket_system}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  nlp_service:
    build: ./nlp_service
    restart: unless-stopped
    environment:
      NLP_API_KEY: ${NLP_API_KEY}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp_service:
        condition: service_started
    environment:
      PORT: 5172
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-ticket_system}:${POSTGRES_PASSWORD:-ticket_system}@postgres:5432/${POSTGRES_DB:-ticket_system}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5172}
      NLP_SERVER_URL: http://nlp_service:8000
      NLP_API_KEY: ${NLP_API_KEY}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
    ports:
      - '${BACKEND_PORT:-5172}:5172'

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:5172}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 5173
      NODE_ENV: production
    ports:
      - '${FRONTEND_PORT:-5173}:5173'

volumes:
  postgres_data:
